name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Download source zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl.exe -sS -H "Authorization: Bearer $env:GH_TOKEN" -o rel.json "https://api.github.com/repos/zzghsy93/fluffy/releases/tags/source-v1"
          $rel = Get-Content rel.json | ConvertFrom-Json
          $url = $rel.assets[0].url
          $loc = curl.exe -s -I -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" $url | Select-String -Pattern "^location:" | ForEach-Object { $_.Line.Substring(10).Trim() }
          echo "asset redirect: $loc"
          curl.exe -sS -L -o src.zip "$loc"
          Expand-Archive -Path src.zip -DestinationPath . -Force
          Get-ChildItem | Select-Object Name

      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

      # fork 冻结在 Flutter 3.44.0(pubspec intl 0.20.2 与之配套,勿升)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@1.86.0

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Build exe
        run: flutter build windows --release --verbose

      - name: Collect native assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/x64/runner/Release | Out-Null
          Get-ChildItem -Path build -Recurse -Filter sqlcipher.dll | ForEach-Object { Copy-Item $_.FullName build/windows/x64/runner/Release/ }
          Get-ChildItem -Path build -Recurse -Filter webcrypto.dll | ForEach-Object { Copy-Item $_.FullName build/windows/x64/runner/Release/ }
          Get-ChildItem build/windows/x64/runner/Release -Filter *.dll | Select-Object Name

      - name: Zip Release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath fluffychat-fork-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: fluffychat-fork-windows.zip
          retention-days: 14
